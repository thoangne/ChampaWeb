services:
  champa-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: champa-api-container
    ports:
      - "5000:5000"
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=5000
    networks:
      - champa-network

  champa-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://placeholder-project.supabase.co}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-placeholder-anon-key}
    container_name: champa-web-container
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - champa-backend
    networks:
      - champa-network

networks:
  champa-network:
    driver: bridge
