services:
  postgres:
    image: postgres:17-alpine
    container_name: champa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-champa_dev}
      POSTGRES_USER: ${POSTGRES_USER:-champa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-champa_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-champa_user} -d ${POSTGRES_DB:-champa_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - champa-network

  champa-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: champa-api-container
    ports:
      - "5000:5000"
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-champa_user}:${POSTGRES_PASSWORD:-champa_password}@postgres:5432/${POSTGRES_DB:-champa_dev}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - champa-network

  champa-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://placeholder-project.supabase.co}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-placeholder-anon-key}
    container_name: champa-web-container
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - champa-backend
    networks:
      - champa-network

volumes:
  postgres_data:
    name: champa_postgres_data

networks:
  champa-network:
    driver: bridge
